name: Sitemap Monitor

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC (~weekly)
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  actions: write

jobs:
  check-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Check Sitemap for New Pages
        id: sitemap
        run: python scripts/check_sitemap.py

      - name: Commit Updated JSONL
        if: steps.sitemap.outputs.csv_changed == 'true'
        run: |
          git config --global user.name "IPFR Sitemap Bot"
          git config --global user.email "actions@github.com"
          git add metatable-Content.jsonl
          if ! git diff --staged --quiet; then
            MSG="Sitemap Monitor:"
            if [ "${{ steps.sitemap.outputs.new_urls_found }}" == "true" ]; then
              MSG="$MSG Added ${{ steps.sitemap.outputs.new_url_count }} new URL(s)."
            fi
            if [ "${{ steps.sitemap.outputs.deleted_urls_found }}" == "true" ]; then
              MSG="$MSG DELETED ${{ steps.sitemap.outputs.deleted_url_count }} removed URL(s)."
            fi
            git commit -m "$MSG [skip ci]"
            git push
          fi

      - name: Dispatch Scraper
        if: steps.sitemap.outputs.needs_rescrape == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'scrape.yml',
              ref: context.ref || 'main'
            })
            console.log(
              `Dispatched scrape.yml: `
              + `${{ steps.sitemap.outputs.new_url_count }} new URL(s), `
              + `${{ steps.sitemap.outputs.updated_url_count }} updated URL(s)`
            )

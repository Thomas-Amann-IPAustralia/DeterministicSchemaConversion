name: Stage 5 - Relational Normalization

on:
  workflow_dispatch:

jobs:
  normalize_json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install openpyxl

      - name: Run Normalization Script
        run: |
          python scripts/json_to_csv.py \
            --json_dir json_output-enriched \
            --xlsx_path 260305_DB-Strcuture_05.xlsx \
            --link_report_path sqlite_data/link_report.csv

      - name: Commit and Push Data Tables
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Stage 5: Auto-generated Excel and CSV tables [skip ci]"
          file_pattern: '260305_DB-Strcuture_05.xlsx sqlite_data/*'
